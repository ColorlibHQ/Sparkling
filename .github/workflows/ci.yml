name: CI

# Replaces the .travis.yml pipeline, which targeted PHP 5.4-7.1 and stopped
# running when Travis withdrew free OSS builds.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is the theme's declared "Requires PHP"; ceiling is current stable.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check every PHP file
        run: |
          find -L . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -d error_reporting=E_ALL -l \
            | (! grep -v '^No syntax errors')

  phpcs:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      # The versions in composer.lock, so CI and `composer lint` agree.
      - name: Install PHPCS, WordPress Coding Standards and PHPCompatibilityWP
        run: composer install --no-interaction --no-progress

      # phpcs.xml.dist: WordPress-Extra, the sparkling prefix and text domain,
      # and PHP 7.4+ compatibility. Any error or warning fails the job.
      - name: PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  js-css:
    name: Lint JS + CSS + i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Text domain check
        run: npm run i18n:check

      - name: Frontend and release regression tests
        run: npm test

  build:
    name: Build theme archive
    runs-on: ubuntu-latest
    needs: [php, phpcs, js-css]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` runs the text domain check via prebuild.
      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: sparkling-theme
          path: sparkling.zip
          if-no-files-found: error
